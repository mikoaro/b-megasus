<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Megasus A.I.S.N. - Simulator Gateway</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      :root {
        --bg-dark: #0f172a;
        --card-bg: #1e293b;
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --accent-blue: #3b82f6;
        --accent-red: #ef4444;
        --accent-green: #22c55e;
        --chart-grid: #334155;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-primary);
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
      }

      /* Layout Layout */
      .dashboard-container {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 20px;
        height: 100vh;
        padding: 20px;
      }

      /* Sidebar / Controls */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .control-panel {
        background-color: var(--card-bg);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 20px;
      }

      .panel-title {
        color: var(--text-secondary);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        font-weight: 600;
      }

      /* Buttons */
      .btn-custom {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        font-weight: 600;
        text-transform: uppercase;
        border-radius: 8px;
        border: none;
        transition: all 0.2s;
      }

      .btn-start {
        background-color: var(--accent-blue);
        color: white;
      }
      .btn-start:hover {
        background-color: #2563eb;
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
      }

      .btn-stop {
        background-color: #475569;
        color: white;
      }
      .btn-stop:hover {
        background-color: #334155;
      }

      .btn-fault {
        background: linear-gradient(90deg, #ef4444, #b91c1c);
        color: white;
        margin-top: 10px;
      }
      .btn-fault:hover {
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        transform: scale(1.02);
      }

      /* Main Content Area */
      .main-view {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* Telemetry Cards Row */
      .stats-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px;
      }

      .stat-card {
        background-color: var(--card-bg);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .stat-value {
        font-size: 2.5rem;
        font-weight: 700;
        font-family: "Courier New", Courier, monospace; /* Technical feel */
      }

      .stat-label {
        color: var(--text-secondary);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 5px;
      }

      /* Chart Area */
      .chart-container {
        flex-grow: 1;
        background-color: var(--card-bg);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 20px;
        position: relative;
      }

      /* Status Indicators */
      .status-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.8rem;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .status-normal {
        color: var(--accent-green);
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid var(--accent-green);
      }
      .status-critical {
        color: var(--accent-red);
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid var(--accent-red);
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <div class="sidebar">
        <h4 class="mb-4 fw-bold">
          Kinetic Capacitor Guardian <br /><span class="text-secondary fs-6"
            >Simulator Gateway</span
          >
        </h4>

        <div class="control-panel">
          <div class="panel-title">Operations Control</div>
          <div id="system-status" class="status-badge status-normal">
            SYSTEM: NORMAL
          </div>

          <button class="btn-custom btn-start" onclick="setMode('HUMAN')">
            🟢 Start / Normal Ops
          </button>
          <button
            class="btn-custom btn-stop"
            onclick="window.location.reload()"
          >
            🛑 Stop Mock
          </button>
        </div>

        <div class="control-panel">
          <div class="panel-title">Fault Injection</div>
          <button class="btn-custom btn-fault" onclick="triggerFault()">
            🔥 Inject Fault: Thermal Runaway
          </button>
          <p class="text-secondary mt-2" style="font-size: 0.75rem">
            Triggers: High ESR (>2.0Ω), High Temp (>95°C), Smoke Image
          </p>
        </div>
      </div>

      <div class="main-view">
        <div class="panel-title mb-0">Real-Time Telemetry Stream</div>

        <div class="stats-row">
          <div class="stat-card">
            <div
              class="stat-value"
              id="val-temp"
              style="color: var(--accent-blue)"
            >
              --.-
            </div>
            <div class="stat-label">Core Temp (°C)</div>
          </div>
          <div class="stat-card">
            <div
              class="stat-value"
              id="val-risk"
              style="color: var(--text-primary)"
            >
              --%
            </div>
            <div class="stat-label">Risk Score</div>
          </div>
          <div class="stat-card">
            <div
              class="stat-value"
              id="val-torque"
              style="color: var(--accent-blue)"
            >
              --
            </div>
            <div class="stat-label">Torque Limit (%)</div>
          </div>
        </div>

        <div class="chart-container">
          <canvas id="telemetryChart"></canvas>
        </div>
      </div>
    </div>

    <script>
      // --- 1. SETUP CHART ---
      const ctx = document.getElementById("telemetryChart").getContext("2d");
      const MAX_DATA_POINTS = 50;

      const telemetryChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: Array(MAX_DATA_POINTS).fill(""),
          datasets: [
            {
              label: "Core Temp (°C)",
              borderColor: "#3b82f6", // Blue
              backgroundColor: "rgba(59, 130, 246, 0.1)",
              borderWidth: 2,
              tension: 0.4,
              data: Array(MAX_DATA_POINTS).fill(null),
              yAxisID: "y",
            },
            {
              label: "Risk Score (%)",
              borderColor: "#ef4444", // Red
              backgroundColor: "rgba(239, 68, 68, 0.0)",
              borderWidth: 2,
              borderDash: [5, 5],
              tension: 0.4,
              data: Array(MAX_DATA_POINTS).fill(null),
              yAxisID: "y1",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false, // Disable animation for performance
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { labels: { color: "#94a3b8" } },
          },
          scales: {
            x: {
              grid: { color: "#334155" },
              ticks: { display: false }, // Hide time labels for cleanliness
            },
            y: {
              type: "linear",
              display: true,
              position: "left",
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8" },
              suggestedMin: 40,
              suggestedMax: 120,
            },
            y1: {
              type: "linear",
              display: true,
              position: "right",
              grid: { drawOnChartArea: false }, // Avoid grid clutter
              ticks: { color: "#ef4444" },
              suggestedMin: 0,
              suggestedMax: 100,
            },
          },
        },
      });

      // --- 2. WEBSOCKET CONNECTION ---
      // Dynamically determine WS URL based on current host
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      // Adjust port if running via Python directly vs NextJS proxy. Defaulting to 8080 as per instructions.
      // const wsUrl = `${protocol}://${window.location.hostname}:8080/ws/telemetry`;
      // Determine Host: window.location.host automatically includes port if needed (e.g. localhost:8080)
      // On Cloud Run, it will just be "your-app.run.app" (no port), which is correct for external access.
      const wsUrl = `${protocol}://${window.location.host}/ws/telemetry`;

      let socket;

      function connect() {
        console.log("Connecting to", wsUrl);
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
          console.log("Connected to Telemetry Stream");
        };

        socket.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);

            if (msg.type === "DATA") {
              updateDashboard(msg.payload);
            }
          } catch (e) {
            console.error("Parse Error", e);
          }
        };

        socket.onclose = () => {
          console.log("Disconnected. Retrying in 2s...");
          setTimeout(connect, 2000);
        };
      }

      // --- 3. UI UPDATE LOGIC ---
      function updateDashboard(data) {
        // A. Update Cards
        const tempEl = document.getElementById("val-temp");
        const riskEl = document.getElementById("val-risk");
        const torqueEl = document.getElementById("val-torque");
        const statusEl = document.getElementById("system-status");

        tempEl.innerText = data.core_temp_c.toFixed(1);
        riskEl.innerText = data.thermal_runaway_risk;

        // Calculate Torque % (assuming 850 is max)
        const torquePct = Math.round((data.torque_nm / 850) * 100);
        torqueEl.innerText = torquePct;

        // B. Color Logic
        if (data.core_temp_c > 95) {
          tempEl.style.color = "#ef4444"; // Red
        } else if (data.core_temp_c > 75) {
          tempEl.style.color = "#f97316"; // Orange
        } else {
          tempEl.style.color = "#3b82f6"; // Blue
        }

        if (data.state === "CRITICAL") {
          statusEl.innerText = "SYSTEM: CRITICAL FAULT";
          statusEl.className = "status-badge status-critical";
        } else {
          statusEl.innerText = "SYSTEM: NORMAL";
          statusEl.className = "status-badge status-normal";
        }

        // C. Update Chart
        updateChartData(data.core_temp_c, data.thermal_runaway_risk);
      }

      function updateChartData(temp, risk) {
        const labels = telemetryChart.data.labels;
        const tempData = telemetryChart.data.datasets[0].data;
        const riskData = telemetryChart.data.datasets[1].data;

        // Shift Logic
        tempData.shift();
        tempData.push(temp);

        riskData.shift();
        riskData.push(risk);

        telemetryChart.update();
      }

      // --- 4. CONTROL FUNCTIONS ---
      const API_URL = `http://${window.location.hostname}:8080`;

      async function triggerFault() {
        try {
          await fetch(`${API_URL}/simulate/fault`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode: "HUMAN" }),
          });
          console.log("Fault Injection Sent");
        } catch (e) {
          console.error("API Error", e);
          alert("Failed to contact backend");
        }
      }

      async function setMode(mode) {
        // Reset simulation via same endpoint or dedicated reset if available
        // For now, using fault endpoint with NORMAL params logic if supported,
        // or we just reload page to clear state visually.
        // Assuming backend accepts a Reset command or we just trigger normal ops logic.
        // Implementing basic log for now.
        console.log("Mode set to:", mode);
        // Optional: Call a reset endpoint if you added one to backend
      }

      // Start
      connect();
    </script>
  </body>
</html>
