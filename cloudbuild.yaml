steps:
  # 1. Build the Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_REPO_NAME}:$COMMIT_SHA', '.']

  # 2. Push the Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_REPO_NAME}:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_REPO_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
      # MOUNT CLOUD SQL CONNECTION (Crucial for Postgres)
      - '--add-cloudsql-instances'
      - '${_DB_INSTANCE_NAME}'

# Redirect logs to Cloud Logging (prevents storage bucket permission errors)
options:
  logging: CLOUD_LOGGING_ONLY

# Define your substitution variables
substitutions:
    _REPO_NAME: 'aisn-backend-repo'   # Name for your Docker image
    _SERVICE_NAME: 'aisn-backend-prod' # Name for the Cloud Run service
    _REGION: 'us-central1'
    # REPLACE THIS WITH YOUR ACTUAL SQL CONNECTION NAME
    # Format: project-id:region:instance-name
    _DB_INSTANCE_NAME: 'hypercure:us-central1:megasus-prod-postgres-db'

images:
  - 'gcr.io/$PROJECT_ID/${_REPO_NAME}:$COMMIT_SHA'